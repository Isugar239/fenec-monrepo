<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pupper Screen</title>
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1f27;
    --line: #2c3440;
    --text: #e8ecf2;
    --dim: #8b95a7;
    --accent: #3d8bfd;
    --ok: #3ecf8e;
    --bad: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 2;
  }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: 650; }
  header p { margin: 4px 0 0; color: var(--dim); font-size: 0.85rem; }
  .status {
    display: inline-block;
    margin-top: 8px;
    padding: 3px 10px;
    border-radius: 999px;
    background: #242b35;
    color: var(--dim);
    font-size: 0.8rem;
  }
  .status.on { background: #163528; color: var(--ok); }
  main { padding: 14px 16px 40px; max-width: 720px; margin: 0 auto; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  section h2 { margin: 0 0 10px; font-size: 0.95rem; color: #c9d2e0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, .filebtn {
    appearance: none;
    border: 1px solid #3a4556;
    background: #273041;
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:hover, .filebtn:hover { background: #314054; }
  button.primary { background: #1f5fad; border-color: #3d8bfd; }
  button.primary:hover { background: #276fc7; }
  button.danger { background: #6d1f1f; border-color: #a33; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .filebtn { display: inline-block; }
  .filebtn input { display: none; }
  input[type=url], input[type=text] {
    flex: 1;
    min-width: 180px;
    background: #0f1319;
    color: var(--text);
    border: 1px solid #3a4556;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.95rem;
  }
  .hint { color: var(--dim); font-size: 0.8rem; margin-top: 8px; }
  .msg {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    background: #222833;
    display: none;
  }
  .msg.show { display: block; }
  .msg.bad { background: #3a1c1c; color: #ffb8b8; }
  .msg.ok { background: #163528; color: #b8f0d2; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: grid;
    grid-template-columns: 64px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: #141920;
  }
  .item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .thumb {
    width: 64px;
    height: 64px;
    border-radius: 8px;
    background: #0b0e12;
    object-fit: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dim);
    font-size: 0.7rem;
    overflow: hidden;
  }
  .thumb img, .thumb video { width: 100%; height: 100%; object-fit: cover; }
  .meta { min-width: 0; }
  .meta .name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .type { color: var(--dim); font-size: 0.8rem; }
  .actions { display: flex; flex-direction: column; gap: 6px; }
  .actions button { padding: 8px 10px; white-space: nowrap; }
  .empty { color: var(--dim); padding: 12px 4px; }
</style>
</head>
<body>
<header>
  <h1>Pupper Screen</h1>
  <p>Загрузи фото/видео или вставь YouTube — и покажи на экране робота</p>
  <span id="scr" class="status">экран выкл</span>
</header>
<main>
  <section>
    <h2>Экран робота</h2>
    <div class="row">
      <button class="primary" id="btn-open">Открыть экран</button>
      <button class="danger" id="btn-stop">Остановить показ</button>
    </div>
    <p class="hint">Открывает Chromium fullscreen на HDMI Pupper. Остановить — закрывает браузер.</p>
    <div id="msg-screen" class="msg"></div>
  </section>

  <section>
    <h2>Загрузить фото или видео</h2>
    <div class="row">
      <label class="filebtn">Выбрать файл
        <input id="file" type="file" accept="image/*,video/*,.mp4,.webm,.mov,.mkv,.jpg,.jpeg,.png,.gif,.webp">
      </label>
      <button class="primary" id="btn-upload" disabled>Загрузить</button>
    </div>
    <p class="hint" id="file-name">Файл не выбран</p>
    <div id="msg-upload" class="msg"></div>
  </section>

  <section>
    <h2>YouTube-ссылка</h2>
    <div class="row">
      <input id="yt" type="url" placeholder="https://youtu.be/... или youtube.com/watch?v=...">
      <button class="primary" id="btn-yt">Добавить</button>
    </div>
    <div id="msg-yt" class="msg"></div>
  </section>

  <section>
    <h2>Библиотека</h2>
    <div id="list" class="list"><div class="empty">Пока пусто</div></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);

function showMsg(el, text, ok = true) {
  el.textContent = text;
  el.className = "msg show " + (ok ? "ok" : "bad");
}

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function typeLabel(t) {
  return ({ image: "фото", video: "видео", youtube: "YouTube" })[t] || t;
}

function thumbHtml(item) {
  if (item.type === "image") {
    return `<div class="thumb"><img src="/media/${encodeURIComponent(item.file)}" alt=""></div>`;
  }
  if (item.type === "video") {
    return `<div class="thumb"><video src="/media/${encodeURIComponent(item.file)}" muted></video></div>`;
  }
  return `<div class="thumb">YT</div>`;
}

let currentId = null;

function render(data) {
  currentId = data.current;
  const list = $("list");
  if (!data.items.length) {
    list.innerHTML = '<div class="empty">Пока пусто — загрузи файл или добавь YouTube</div>';
    return;
  }
  list.innerHTML = data.items.map((item) => `
    <div class="item ${item.id === currentId ? "active" : ""}" data-id="${item.id}">
      ${thumbHtml(item)}
      <div class="meta">
        <div class="name">${escapeHtml(item.name)}</div>
        <div class="type">${typeLabel(item.type)}${item.id === currentId ? " · сейчас на экране" : ""}</div>
      </div>
      <div class="actions">
        <button class="primary" data-show="${item.id}">Показать</button>
        <button data-del="${item.id}">Удалить</button>
      </div>
    </div>
  `).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  })[c]);
}

async function refresh() {
  const data = await api("/api/media");
  const status = await api("/api/status");
  render(data);
  const scr = $("scr");
  if (status.chromium) {
    scr.textContent = "экран вкл";
    scr.className = "status on";
  } else {
    scr.textContent = "экран выкл";
    scr.className = "status";
  }
}

$("file").addEventListener("change", () => {
  const f = $("file").files[0];
  $("btn-upload").disabled = !f;
  $("file-name").textContent = f ? f.name : "Файл не выбран";
});

$("btn-upload").addEventListener("click", async () => {
  const f = $("file").files[0];
  if (!f) return;
  const fd = new FormData();
  fd.append("file", f);
  $("btn-upload").disabled = true;
  try {
    const data = await api("/api/upload", { method: "POST", body: fd });
    showMsg($("msg-upload"), "Загружено — показываю на экране", true);
    $("file").value = "";
    $("file-name").textContent = "Файл не выбран";
    await postJson("/api/show", { id: data.item.id });
    await refresh();
  } catch (e) {
    showMsg($("msg-upload"), e.message, false);
    $("btn-upload").disabled = false;
  }
});

$("btn-yt").addEventListener("click", async () => {
  const url = $("yt").value.trim();
  if (!url) return;
  try {
    await api("/api/youtube", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url }),
    });
    $("yt").value = "";
    showMsg($("msg-yt"), "Добавлено", true);
    await refresh();
  } catch (e) {
    showMsg($("msg-yt"), e.message, false);
  }
});

async function postJson(path, body = {}) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
}

$("btn-open").addEventListener("click", async () => {
  try {
    await postJson("/api/open_screen");
    showMsg($("msg-screen"), "Chromium открыт на экране робота", true);
    await refresh();
  } catch (e) {
    showMsg($("msg-screen"), e.message, false);
  }
});

$("btn-stop").addEventListener("click", async () => {
  try {
    await postJson("/api/stop");
    showMsg($("msg-screen"), "Показ остановлен", true);
    await refresh();
  } catch (e) {
    showMsg($("msg-screen"), e.message, false);
  }
});

$("list").addEventListener("click", async (ev) => {
  const show = ev.target.getAttribute("data-show");
  const del = ev.target.getAttribute("data-del");
  if (show) {
    try {
      await postJson("/api/show", { id: show });
      await refresh();
    } catch (e) {
      showMsg($("msg-screen"), e.message, false);
    }
  }
  if (del) {
    try {
      await api("/api/media/" + del, { method: "DELETE" });
      await refresh();
    } catch (e) {
      showMsg($("msg-screen"), e.message, false);
    }
  }
});

refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
