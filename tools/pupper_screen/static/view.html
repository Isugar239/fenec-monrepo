<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pupper View</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    color: #888;
    font: 18px/1.3 system-ui, sans-serif;
  }
  #stage {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #stage img, #stage video {
    max-width: 100%;
    max-height: 100%;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    animation: fadeIn 0.35s ease;
  }
  #stage iframe {
    border: 0;
    width: 100%;
    height: 100%;
    animation: fadeIn 0.35s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: scale(0.97); }
    to { opacity: 1; transform: scale(1); }
  }
  #idle {
    text-align: center;
    padding: 24px;
    opacity: 0.7;
  }
  #idle small { display: block; margin-top: 8px; color: #555; font-size: 0.8rem; }
  .spinner {
    width: 64px; height: 64px; margin: 0 auto 12px;
    border: 4px solid #333; border-top-color: #3d8bfd;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="stage">
  <div id="idle"><div class="spinner"></div>Ожидание контента<small>выбери файл на странице управления</small></div>
</div>
<script>
const stage = document.getElementById("stage");
let lastKey = "";

function idle() {
  stage.innerHTML = '<div id="idle"><div class="spinner"></div>Ожидание контента<small>выбери файл на странице управления</small></div>';
}

function showItem(item) {
  const key = item.type + ":" + (item.file || item.youtube_id || "");
  if (key === lastKey) return;
  lastKey = key;
  if (item.type === "image") {
    stage.innerHTML = `<img src="/media/${encodeURIComponent(item.file)}?t=${Date.now()}" alt="">`;
    return;
  }
  if (item.type === "video") {
    stage.innerHTML = `<video src="/media/${encodeURIComponent(item.file)}" autoplay loop controls playsinline></video>`;
    const v = stage.querySelector("video");
    v.play().catch(() => {});
    return;
  }
  if (item.type === "youtube") {
    // Embed с localhost блокируется («Video unavailable»).
    // Сервер открывает youtube.com/watch напрямую в Chromium.
    stage.innerHTML = `<div id="idle">YouTube открывается в браузере…<small>${item.youtube_id}</small></div>`;
    return;
  }
  idle();
}

async function tick() {
  const res = await fetch("/api/current", { cache: "no-store" });
  const data = await res.json();
  if (!data.item) {
    if (lastKey !== "") {
      lastKey = "";
      idle();
    }
    return;
  }
  showItem(data.item);
}

tick();
setInterval(tick, 1000);
</script>
</body>
</html>
